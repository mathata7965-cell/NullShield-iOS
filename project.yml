name: Null
options:
  bundleIdPrefix: com.nullshield
  developmentLanguage: zh-Hant
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1,2"
    GENERATE_INFOPLIST_FILE: NO
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Null:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Null
        excludes:
          - Info.plist
    dependencies:
      - target: NullSafariBlocker
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nullshield.ios
        INFOPLIST_FILE: Null/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
        SWIFT_EMIT_LOC_STRINGS: YES

  NullSafariBlocker:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: NullSafariBlocker
        excludes:
          - Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nullshield.ios.SafariBlocker
        INFOPLIST_FILE: NullSafariBlocker/Info.plist
        APPLICATION_EXTENSION_API_ONLY: YES
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/Frameworks"
          - "@executable_path/../../Frameworks"
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: YES
